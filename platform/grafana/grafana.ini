[paths]

data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[server]
http_port = 3000
domain = localhost
root_url = http://localhost:3000

[database]
type = sqlite3
path = grafana.db

[security]
admin_user = admin
admin_password = 0000
cookie_secure = false
allow_embedding = true

[users]
allow_sign_up = false
allow_org_create = true
auto_assign_org = true
auto_assign_org_role = Viewer

[auth.anonymous]
enabled = false

[snapshots]
external_enabled = false

[log]
mode = console
level = info

[metrics]
enabled = true
interval_seconds = 10
