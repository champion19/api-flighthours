definitions:
  github_com_champion19_api-flighthours_core_interactor_services_domain.MessageType:
    enum:
    - ERROR
    - EXITO
    - WARNING
    - INFO
    - DEBUG
    type: string
    x-enum-varnames:
    - TypeError
    - TypeSuccess
    - TypeWarning
    - TypeInfo
    - TypeDebug
  handlers.AirlineEmployeeRequest:
    properties:
      active:
        type: boolean
      airline_id:
        type: string
      bp:
        type: string
      email:
        type: string
      end_date:
        type: string
      identification_number:
        type: string
      name:
        type: string
      role:
        type: string
      start_date:
        type: string
    required:
    - airline_id
    - email
    - identification_number
    - name
    - role
    - start_date
    type: object
  handlers.AirlineListResponse:
    properties:
      _links:
        items:
          $ref: '#/definitions/handlers.Link'
        type: array
      airlines:
        items:
          $ref: '#/definitions/handlers.AirlineResponse'
        type: array
      total:
        type: integer
    type: object
  handlers.AirlineResponse:
    properties:
      _links:
        items:
          $ref: '#/definitions/handlers.Link'
        type: array
      airline_code:
        type: string
      airline_name:
        type: string
      id:
        type: string
      status:
        type: string
    type: object
  handlers.CacheReloadResponse:
    properties:
      after_count:
        type: integer
      before_count:
        type: integer
      message:
        type: string
      success:
        type: boolean
    type: object
  handlers.ChangePasswordRequest:
    properties:
      confirm_password:
        minLength: 8
        type: string
      current_password:
        type: string
      email:
        type: string
      new_password:
        minLength: 8
        type: string
    required:
    - confirm_password
    - current_password
    - email
    - new_password
    type: object
  handlers.ChangePasswordResponse:
    properties:
      changed:
        type: boolean
      email:
        type: string
    type: object
  handlers.EmployeeAirlineInfoResponse:
    properties:
      _links:
        items:
          $ref: '#/definitions/handlers.Link'
        type: array
      airline_code:
        type: string
      airline_id:
        type: string
      airline_name:
        type: string
      bp:
        type: string
    type: object
  handlers.EmployeeRequest:
    properties:
      active:
        type: boolean
      airline:
        type: string
      bp:
        type: string
      email:
        type: string
      end_date:
        type: string
      identificationNumber:
        type: string
      name:
        type: string
      password:
        type: string
      role:
        type: string
      start_date:
        type: string
    type: object
  handlers.EmployeeResponse:
    properties:
      _links:
        items:
          $ref: '#/definitions/handlers.Link'
        type: array
      active:
        type: boolean
      airline:
        type: string
      bp:
        type: string
      email:
        type: string
      end_date:
        type: string
      id:
        type: string
      identification_number:
        type: string
      name:
        type: string
      role:
        type: string
      start_date:
        type: string
    type: object
  handlers.Link:
    properties:
      href:
        type: string
      method:
        type: string
      rel:
        type: string
    type: object
  handlers.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  handlers.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  handlers.MessageCreatedResponse:
    properties:
      _links:
        items:
          $ref: '#/definitions/handlers.Link'
        type: array
      id:
        type: string
    type: object
  handlers.MessageListResponse:
    properties:
      _links:
        items:
          $ref: '#/definitions/handlers.Link'
        type: array
      count:
        type: integer
      messages:
        items:
          $ref: '#/definitions/handlers.MessageResponse'
        type: array
    type: object
  handlers.MessageRequest:
    properties:
      active:
        type: boolean
      category:
        type: string
      code:
        type: string
      content:
        type: string
      module:
        type: string
      title:
        type: string
      type:
        $ref: '#/definitions/github_com_champion19_api-flighthours_core_interactor_services_domain.MessageType'
    type: object
  handlers.MessageResponse:
    properties:
      _links:
        items:
          $ref: '#/definitions/handlers.Link'
        type: array
      active:
        type: boolean
      category:
        type: string
      code:
        type: string
      content:
        type: string
      id:
        type: string
      module:
        type: string
      title:
        type: string
      type:
        $ref: '#/definitions/github_com_champion19_api-flighthours_core_interactor_services_domain.MessageType'
    type: object
  handlers.MessageUpdatedResponse:
    properties:
      _links:
        items:
          $ref: '#/definitions/handlers.Link'
        type: array
    type: object
  handlers.PasswordResetRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  handlers.PasswordResetResponse:
    properties:
      sent:
        type: boolean
    type: object
  handlers.ResendVerificationEmailRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  handlers.ResendVerificationEmailResponse:
    properties:
      email:
        type: string
      sent:
        type: boolean
    type: object
  handlers.UpdateEmployeeAirlineRequest:
    properties:
      active:
        type: boolean
      airline_id:
        type: string
      bp:
        type: string
      end_date:
        type: string
      identification_number:
        type: string
      name:
        type: string
      role:
        type: string
      start_date:
        type: string
    required:
    - airline_id
    type: object
  handlers.UpdateEmployeeAirlineResponse:
    properties:
      _links:
        items:
          $ref: '#/definitions/handlers.Link'
        type: array
      active:
        type: boolean
      airline_id:
        type: string
      airline_name:
        type: string
      bp:
        type: string
      end_date:
        type: string
      identification_number:
        type: string
      name:
        type: string
      role:
        type: string
      start_date:
        type: string
      updated:
        type: boolean
    type: object
  handlers.UpdateEmployeeRequest:
    properties:
      active:
        type: boolean
      end_date:
        type: string
      identificationNumber:
        type: string
      name:
        type: string
      role:
        type: string
      start_date:
        type: string
    type: object
  handlers.UpdateEmployeeResponse:
    properties:
      _links:
        items:
          $ref: '#/definitions/handlers.Link'
        type: array
      id:
        type: string
      updated:
        type: boolean
    type: object
  handlers.UpdatePasswordRequest:
    properties:
      confirm_password:
        minLength: 8
        type: string
      new_password:
        minLength: 8
        type: string
      token:
        type: string
    required:
    - confirm_password
    - new_password
    - token
    type: object
  handlers.UpdatePasswordResponse:
    properties:
      email:
        type: string
      updated:
        type: boolean
    type: object
  handlers.VerifyEmailRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  handlers.VerifyEmailResponse:
    properties:
      email:
        type: string
      verified:
        type: boolean
    type: object
  middleware.APIResponse:
    properties:
      code:
        type: string
      data: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  middleware.ErrorResponse:
    properties:
      code:
        type: string
      message:
        type: string
      success:
        type: boolean
    type: object
info:
  contact: {}
paths:
  /airline-employees:
    post:
      consumes:
      - application/json
      description: Creates a new airline employee
      parameters:
      - description: Airline Employee data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.AirlineEmployeeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Create airline employee
      tags:
      - AirlineEmployees
  /airlines:
    get:
      description: Returns a list of all airlines with optional filters
      parameters:
      - description: Filter by status (true/false/active/inactive)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AirlineListResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      summary: List all airlines
      tags:
      - Airlines
  /airlines/{id}:
    get:
      description: Returns an airline's information by its obfuscated ID
      parameters:
      - description: Airline ID (obfuscated)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AirlineResponse'
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "404":
          description: Airline not found
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      summary: Get airline by ID
      tags:
      - Airlines
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Allows an authenticated user to change their password by providing
        the current password
      parameters:
      - description: Current and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password changed
          schema:
            $ref: '#/definitions/handlers.ChangePasswordResponse'
        "400":
          description: Passwords don't match
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "401":
          description: Current password incorrect
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change authenticated user password
      tags:
      - Authentication
  /auth/password-reset:
    post:
      consumes:
      - application/json
      description: Sends an email with instructions to reset the password. Always
        returns success for security.
      parameters:
      - description: Email for password reset
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.PasswordResetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Reset email sent
          schema:
            $ref: '#/definitions/handlers.PasswordResetResponse'
        "400":
          description: Invalid email
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      summary: Request password reset
      tags:
      - Authentication
  /auth/resend-verification:
    post:
      consumes:
      - application/json
      description: Resends the verification email to a registered user who hasn't
        verified their account
      parameters:
      - description: Email to resend verification
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ResendVerificationEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Email sent
          schema:
            $ref: '#/definitions/handlers.ResendVerificationEmailResponse'
        "400":
          description: Invalid email
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "409":
          description: Email already verified
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      summary: Resend verification email
      tags:
      - Authentication
  /auth/update-password:
    post:
      consumes:
      - application/json
      description: Allows updating the password using a token received by email. Token
        expires in 12 hours.
      parameters:
      - description: Token and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdatePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password updated
          schema:
            $ref: '#/definitions/handlers.UpdatePasswordResponse'
        "400":
          description: Passwords don't match or invalid token
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "401":
          description: Expired or invalid token
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      summary: Update password with reset token
      tags:
      - Authentication
  /auth/verify-email:
    post:
      consumes:
      - application/json
      description: Verifies the user's email using a JWT proxy token
      parameters:
      - description: Verification token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Email verified
          schema:
            $ref: '#/definitions/handlers.VerifyEmailResponse'
        "400":
          description: Invalid or expired token
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "409":
          description: Email already verified
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      summary: Verify user email
      tags:
      - Authentication
  /employee/me:
    get:
      description: Returns the profile information of the authenticated employee
      produces:
      - application/json
      responses:
        "200":
          description: User profile
          schema:
            $ref: '#/definitions/handlers.EmployeeResponse'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get authenticated user profile
      tags:
      - Employees
  /employee/me/airline:
    get:
      description: Returns the airline information (airline_id, airline_name, bp)
        of the authenticated employee
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.EmployeeAirlineInfoResponse'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "404":
          description: Employee not found or no airline assigned
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get authenticated employee's airline information (HU24)
      tags:
      - AirlineEmployees
    put:
      consumes:
      - application/json
      description: Updates all employee fields including airline_id, bp, name, dates,
        role for the authenticated employee
      parameters:
      - description: Employee airline information to update
        in: body
        name: airline
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateEmployeeAirlineRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.UpdateEmployeeAirlineResponse'
        "400":
          description: Invalid request data
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "404":
          description: Employee not found
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "422":
          description: Invalid airline reference
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update authenticated employee's airline information (HU26)
      tags:
      - AirlineEmployees
  /employees/me:
    delete:
      description: Permanently deletes the authenticated employee's account from the
        system (Keycloak + DB)
      produces:
      - application/json
      responses:
        "200":
          description: Account deleted
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "404":
          description: Employee not found
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete authenticated user account
      tags:
      - Employees
    put:
      consumes:
      - application/json
      description: 'Updates the basic information of the authenticated employee. Preserves:
        email, password, airline, bp.'
      parameters:
      - description: Employee data to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateEmployeeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Employee updated
          schema:
            $ref: '#/definitions/handlers.UpdateEmployeeResponse'
        "400":
          description: Invalid data
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "404":
          description: Employee not found
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update authenticated user information
      tags:
      - Employees
  /login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns access tokens
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            $ref: '#/definitions/handlers.LoginResponse'
        "400":
          description: Invalid credentials format
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "401":
          description: Email not verified or incorrect credentials
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      summary: User login
      tags:
      - Authentication
  /messages:
    get:
      description: Returns a list of all system messages with optional filters
      parameters:
      - description: Filter by module
        in: query
        name: module
        type: string
      - description: Filter by type (ERROR, WARNING, INFO, SUCCESS)
        in: query
        name: type
        type: string
      - description: Filter by category
        in: query
        name: category
        type: string
      - description: Filter by active status (true/false)
        in: query
        name: active
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageListResponse'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List all system messages
      tags:
      - Messages
    post:
      consumes:
      - application/json
      description: Creates a new message for the centralized messaging system
      parameters:
      - description: Message data
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/handlers.MessageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.MessageCreatedResponse'
        "400":
          description: Invalid request data
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "409":
          description: Message code already exists
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new system message
      tags:
      - Messages
  /messages/{id}:
    delete:
      description: Permanently deletes a message from the system
      parameters:
      - description: Message ID (obfuscated)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Message deleted
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "404":
          description: Message not found
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a system message
      tags:
      - Messages
    get:
      description: Returns a specific system message by its ID
      parameters:
      - description: Message ID (obfuscated)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "404":
          description: Message not found
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a message by ID
      tags:
      - Messages
    put:
      consumes:
      - application/json
      description: Updates an existing message in the system
      parameters:
      - description: Message ID (obfuscated)
        in: path
        name: id
        required: true
        type: string
      - description: Message data
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/handlers.MessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageUpdatedResponse'
        "400":
          description: Invalid request data
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "401":
          description: Not authenticated
