host: localhost:8081
info:
  contact:
    email: support@champion19.com
    name: Champion19 Support
  description: API para gestión de horas de vuelo de pilotos y tripulantes
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Flighthours API
  version: "1.0"
paths:
  /aircraft-families/{family}:
    get:
      description: Returns aircraft family information (family and manufacturer) for
        a specific family (HU32)
      parameters:
      - description: Aircraft Family (e.g., A320, B737)
        in: path
        name: family
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AircraftFamilyListResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get aircraft family by family name
      tags:
      - Aircraft Families
  /aircraft-models:
    get:
      description: Returns a list of all aircraft models with optional engine type
        filter
      parameters:
      - description: Filter by engine type (e.g., JET, TUR)
        in: query
        name: engine_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AircraftModelListResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List all aircraft models
      tags:
      - Aircraft Models
  /aircraft-models/{id}:
    get:
      consumes:
      - application/json
      description: Returns aircraft model information by ID (accepts both UUID and
        obfuscated ID)
      parameters:
      - description: Aircraft Model ID (obfuscated ID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get aircraft model by ID
      tags:
      - Aircraft Models
  /aircraft-models/{id}/activate:
    patch:
      consumes:
      - application/json
      description: Sets aircraft model status to active (HU42 - accepts obfuscated
        ID only)
      parameters:
      - description: Aircraft Model ID (obfuscated ID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Activate aircraft model
      tags:
      - Aircraft Models
  /aircraft-models/{id}/deactivate:
    patch:
      consumes:
      - application/json
      description: Sets aircraft model status to inactive (HU41 - accepts obfuscated
        ID only)
      parameters:
      - description: Aircraft Model ID (obfuscated ID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Deactivate aircraft model
      tags:
      - Aircraft Models
  /airline-routes:
    get:
      consumes:
      - application/json
      description: Returns a list of all airline-route associations with optional
        filters
      parameters:
      - description: Filter by airline code
        in: query
        name: airline_code
        type: string
      - description: Filter by status (true/false/1/0)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Airline routes list
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List all airline routes
      tags:
      - Airline Routes
  /airline-routes/{id}/activate:
    patch:
      consumes:
      - application/json
      description: Sets the airline route status to active. Idempotent operation.
      parameters:
      - description: Airline Route ID (obfuscated ID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Airline route activated
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "404":
          description: Airline route not found
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Activate an airline route
      tags:
      - Airline Routes
  /airline-routes/{id}/deactivate:
    patch:
      consumes:
      - application/json
      description: Sets the airline route status to inactive. Idempotent operation.
      parameters:
      - description: Airline Route ID (obfuscated ID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Airline route deactivated
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "404":
          description: Airline route not found
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Deactivate an airline route
      tags:
      - Airline Routes
  /airlines:
    get:
      description: Returns a list of all airlines with optional status filter
      parameters:
      - description: Filter by status (true for active, false for inactive)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AirlineListResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List all airlines
      tags:
      - Airlines
  /airlines/{id}:
    get:
      consumes:
      - application/json
      description: Returns airline information by ID (accepts both UUID and obfuscated
        ID)
      parameters:
      - description: Airline ID (obfuscated ID)
