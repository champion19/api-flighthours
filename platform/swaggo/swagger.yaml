basePath: /flighthours/api/v1
definitions:
  github_com_champion19_flighthours-api_core_interactor_services_domain.MessageType:
    enum:
    - ERROR
    - EXITO
    - WARNING
    - INFO
    - DEBUG
    type: string
    x-enum-varnames:
    - TypeError
    - TypeSuccess
    - TypeWarning
    - TypeInfo
    - TypeDebug
  handlers.CacheReloadResponse:
    properties:
      after_count:
        type: integer
      before_count:
        type: integer
      message:
        type: string
      success:
        type: boolean
    type: object
  handlers.ChangePasswordRequest:
    properties:
      confirm_password:
        minLength: 8
        type: string
      current_password:
        type: string
      email:
        type: string
      new_password:
        minLength: 8
        type: string
    required:
    - confirm_password
    - current_password
    - email
    - new_password
    type: object
  handlers.ChangePasswordResponse:
    properties:
      changed:
        type: boolean
      email:
        type: string
    type: object
  handlers.EmployeeRequest:
    properties:
      active:
        type: boolean
      airline:
        type: string
      bp:
        type: string
      email:
        type: string
      end_date:
        type: string
      identificationNumber:
        type: string
      name:
        type: string
      password:
        type: string
      role:
        type: string
      start_date:
        type: string
    type: object
  handlers.EmployeeResponse:
    properties:
      _links:
        items:
          $ref: '#/definitions/handlers.Link'
        type: array
      active:
        type: boolean
      airline:
        type: string
      bp:
        type: string
      email:
        type: string
      end_date:
        type: string
      id:
        type: string
      identification_number:
        type: string
      name:
        type: string
      role:
        type: string
      start_date:
        type: string
    type: object
  handlers.Link:
    properties:
      href:
        type: string
      method:
        type: string
      rel:
        type: string
    type: object
  handlers.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  handlers.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  handlers.MessageCreatedResponse:
    properties:
      _links:
        items:
          $ref: '#/definitions/handlers.Link'
        type: array
      id:
        type: string
    type: object
  handlers.MessageListResponse:
    properties:
      _links:
        items:
          $ref: '#/definitions/handlers.Link'
        type: array
      count:
        type: integer
      messages:
        items:
          $ref: '#/definitions/handlers.MessageResponse'
        type: array
    type: object
  handlers.MessageRequest:
    properties:
      active:
        type: boolean
      category:
        type: string
      code:
        type: string
      content:
        type: string
      module:
        type: string
      title:
        type: string
      type:
        $ref: '#/definitions/github_com_champion19_flighthours-api_core_interactor_services_domain.MessageType'
    type: object
  handlers.MessageResponse:
    properties:
      _links:
        items:
          $ref: '#/definitions/handlers.Link'
        type: array
      active:
        type: boolean
      category:
        type: string
      code:
        type: string
      content:
        type: string
      id:
        type: string
      module:
        type: string
      title:
        type: string
      type:
        $ref: '#/definitions/github_com_champion19_flighthours-api_core_interactor_services_domain.MessageType'
    type: object
  handlers.MessageUpdatedResponse:
    properties:
      _links:
        items:
          $ref: '#/definitions/handlers.Link'
        type: array
    type: object
  handlers.RegisterEmployeeResponse:
    properties:
      _links:
        items:
          $ref: '#/definitions/handlers.Link'
        type: array
    type: object
  handlers.ResendVerificationEmailRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  handlers.ResendVerificationEmailResponse:
    properties:
      email:
        type: string
      sent:
        type: boolean
    type: object
  handlers.UpdateEmployeeRequest:
    properties:
      active:
        type: boolean
      end_date:
        type: string
      identificationNumber:
        type: string
      name:
        type: string
      role:
        type: string
      start_date:
        type: string
    type: object
  handlers.UpdateEmployeeResponse:
    properties:
      _links:
        items:
          $ref: '#/definitions/handlers.Link'
        type: array
      id:
        type: string
      updated:
        type: boolean
    type: object
  handlers.VerifyEmailRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  handlers.VerifyEmailResponse:
    properties:
      email:
        type: string
      verified:
        type: boolean
    type: object
  middleware.APIResponse:
    properties:
      code:
        type: string
      data: {}
      message:
        type: string
      success:
        type: boolean
    type: object
host: localhost:8082
info:
  contact:
    email: support@flighthours.com
    name: FlightHours Support
  description: API para gestión de empleados de aerolínea y control de horas de vuelo
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: FlightHours API
  version: "1.0"
paths:
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Permite a un usuario cambiar su contraseña conociendo la contraseña
        actual
      parameters:
      - description: Email, contraseña actual y nueva
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Contraseña cambiada exitosamente
          schema:
            allOf:
            - $ref: '#/definitions/middleware.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.ChangePasswordResponse'
              type: object
        "400":
          description: Error de validación - Contraseñas no coinciden
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "401":
          description: Contraseña actual incorrecta
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "404":
          description: Usuario no encontrado
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/middleware.APIResponse'
      security:
      - BearerAuth: []
      summary: Cambiar contraseña de usuario autenticado
      tags:
      - authentication
  /auth/resend-verification:
    post:
      consumes:
      - application/json
      description: Reenvía el email de verificación a un usuario registrado que no
        ha verificado su cuenta
      parameters:
      - description: Email del usuario
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ResendVerificationEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Email reenviado exitosamente
          schema:
            allOf:
            - $ref: '#/definitions/middleware.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.ResendVerificationEmailResponse'
              type: object
        "400":
          description: Error de validación - Email inválido
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "404":
          description: Usuario no encontrado
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "409":
          description: Email ya verificado
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/middleware.APIResponse'
      summary: Reenviar email de verificación
      tags:
      - authentication
  /auth/verify-email:
    post:
      consumes:
      - application/json
      description: Verifica el email de un usuario usando un token JWT proxy
      parameters:
      - description: Token de verificación
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Email verificado exitosamente
          schema:
            allOf:
            - $ref: '#/definitions/middleware.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.VerifyEmailResponse'
              type: object
        "400":
          description: Token inválido o expirado
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "404":
          description: Usuario no encontrado
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "409":
          description: Email ya estaba verificado
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/middleware.APIResponse'
      summary: Verificar email de usuario
      tags:
      - authentication
  /employee/me:
    get:
      consumes:
      - application/json
      description: Obtiene la información del empleado que realiza la petición usando
        el token JWT
      produces:
      - application/json
      responses:
        "200":
          description: Datos del usuario autenticado
          schema:
            allOf:
            - $ref: '#/definitions/middleware.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.EmployeeResponse'
              type: object
        "401":
          description: No autenticado
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/middleware.APIResponse'
      security:
      - BearerAuth: []
      summary: Obtener perfil del usuario autenticado
      tags:
      - employees
  /employees/me:
    put:
      consumes:
      - application/json
      description: 'Actualiza la información básica del empleado autenticado usando
        el token JWT. Preserva: email, password, airline, bp (estos campos requieren
        otros endpoints).'
      parameters:
      - description: Datos a actualizar
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateEmployeeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Empleado actualizado exitosamente
          schema:
            allOf:
            - $ref: '#/definitions/middleware.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.UpdateEmployeeResponse'
              type: object
        "400":
          description: Error de validación - Datos inválidos
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "401":
          description: No autenticado
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "404":
          description: Empleado no encontrado
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/middleware.APIResponse'
      security:
      - BearerAuth: []
      summary: Actualizar información del empleado autenticado
      tags:
      - employees
    delete:
      consumes:
      - application/json
      description: Elimina permanentemente la cuenta del empleado autenticado del sistema (Keycloak + DB)
      produces:
      - application/json
      responses:
        "200":
          description: Cuenta eliminada exitosamente
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "401":
          description: No autenticado
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "404":
          description: Empleado no encontrado
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/middleware.APIResponse'
      security:
      - BearerAuth: []
      summary: Eliminar cuenta del empleado autenticado
      tags:
      - employees
  /login:
    post:
      consumes:
      - application/json
      description: Autentica un usuario y retorna tokens de acceso
      parameters:
      - description: Credenciales de login
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login exitoso
          schema:
            allOf:
            - $ref: '#/definitions/middleware.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.LoginResponse'
              type: object
        "400":
          description: Credenciales inválidas
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "401":
          description: Email no verificado o credenciales incorrectas
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/middleware.APIResponse'
      summary: Login de usuario
      tags:
      - authentication
  /messages:
    get:
      consumes:
      - application/json
      description: Lista todos los mensajes del sistema con filtros opcionales
      parameters:
      - description: Filtrar por módulo
        in: query
        name: module
        type: string
      - description: Filtrar por tipo (SUCCESS, ERROR, WARNING, INFO)
        in: query
        name: type
        type: string
      - description: Filtrar por categoría
        in: query
        name: category
        type: string
      - description: Filtrar por estado activo
        in: query
        name: active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Lista de mensajes
          schema:
            $ref: '#/definitions/handlers.MessageListResponse'
        "401":
          description: No autenticado
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/middleware.APIResponse'
      security:
      - BearerAuth: []
      summary: Listar todos los mensajes
      tags:
      - messages
    post:
      consumes:
      - application/json
      description: Crea un nuevo mensaje para el sistema de mensajes centralizados
      parameters:
      - description: Datos del mensaje a crear
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.MessageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Mensaje creado exitosamente
          schema:
            allOf:
            - $ref: '#/definitions/middleware.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.MessageCreatedResponse'
              type: object
        "400":
          description: Error de validación
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "401":
          description: No autenticado
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "409":
          description: Código de mensaje duplicado
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/middleware.APIResponse'
      security:
      - BearerAuth: []
      summary: Crear nuevo mensaje del sistema
      tags:
      - messages
  /messages/{id}:
    delete:
      consumes:
      - application/json
      description: Elimina un mensaje del sistema por su ID ofuscado
      parameters:
      - description: ID ofuscado del mensaje
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Mensaje eliminado exitosamente
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "400":
          description: ID inválido
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "401":
          description: No autenticado
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "404":
          description: Mensaje no encontrado
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/middleware.APIResponse'
      security:
      - BearerAuth: []
      summary: Eliminar mensaje
      tags:
      - messages
    get:
      consumes:
      - application/json
      description: Obtiene un mensaje específico por su ID ofuscado
      parameters:
      - description: ID ofuscado del mensaje
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Mensaje encontrado
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: ID inválido
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "401":
          description: No autenticado
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "404":
          description: Mensaje no encontrado
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/middleware.APIResponse'
      security:
      - BearerAuth: []
      summary: Obtener mensaje por ID
      tags:
      - messages
    put:
      consumes:
      - application/json
      description: Actualiza un mensaje del sistema por su ID ofuscado
      parameters:
      - description: ID ofuscado del mensaje
        in: path
        name: id
        required: true
        type: string
      - description: Datos actualizados del mensaje
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.MessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Mensaje actualizado exitosamente
          schema:
            allOf:
            - $ref: '#/definitions/middleware.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.MessageUpdatedResponse'
              type: object
        "400":
          description: Error de validación o ID inválido
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "401":
          description: No autenticado
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "404":
          description: Mensaje no encontrado
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/middleware.APIResponse'
      security:
      - BearerAuth: []
      summary: Actualizar mensaje existente
      tags:
      - messages
  /messages/cache/reload:
    post:
      consumes:
      - application/json
      description: Recarga todos los mensajes desde la base de datos al cache en memoria
      produces:
      - application/json
      responses:
        "200":
          description: Cache recargado exitosamente
          schema:
            $ref: '#/definitions/handlers.CacheReloadResponse'
        "401":
          description: No autenticado
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "500":
          description: Error al recargar cache
          schema:
            $ref: '#/definitions/middleware.APIResponse'
      security:
      - BearerAuth: []
      summary: Recargar cache de mensajes
      tags:
      - messages
  /register:
    post:
      consumes:
      - application/json
      description: Crea una nueva cuenta de empleado en el sistema con sincronización
        a Keycloak
      parameters:
      - description: Datos del empleado a registrar
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.EmployeeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Cuenta creada exitosamente
          schema:
            allOf:
            - $ref: '#/definitions/middleware.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.RegisterEmployeeResponse'
              type: object
        "400":
          description: Error de validación - Datos inválidos
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "409":
          description: Conflicto - Email o número de identidad ya registrado
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/middleware.APIResponse'
      summary: Registrar nueva cuenta de empleado
      tags:
      - accounts
securityDefinitions:
  BearerAuth:
    description: 'Ingrese el token en formato: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
