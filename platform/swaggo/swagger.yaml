basePath: /flighthours/api/v1
definitions:
  github_com_champion19_api-flighthours_core_interactor_services_domain.MessageType:
    enum:
    - ERROR
    - EXITO
    - WARNING
    - INFO
    - DEBUG
    type: string
    x-enum-varnames:
    - TypeError
    - TypeSuccess
    - TypeWarning
    - TypeInfo
    - TypeDebug
  handlers.AddEmployeeAirlineRequest:
    properties:
      airline_id:
        type: string
      bp:
        type: string
      end_date:
        type: string
      start_date:
        type: string
    required:
    - airline_id
    - start_date
    type: object
  handlers.AddEmployeeAirlineResponse:
    properties:
      _links:
        items:
          $ref: '#/definitions/handlers.Link'
        type: array
      airline_id:
        type: string
      airline_name:
        type: string
      bp:
        type: string
      end_date:
        type: string
      start_date:
        type: string
    type: object
  handlers.AirlineListResponse:
    properties:
      _links:
        items:
          $ref: '#/definitions/handlers.Link'
        type: array
      airlines:
        items:
          $ref: '#/definitions/handlers.AirlineResponse'
        type: array
      total:
        type: integer
    type: object
  handlers.AirlineResponse:
    properties:
      _links:
        items:
          $ref: '#/definitions/handlers.Link'
        type: array
      airline_code:
        type: string
      airline_name:
        type: string
      id:
        type: string
      status:
        type: string
    type: object
  handlers.CacheReloadResponse:
    properties:
      after_count:
        type: integer
      before_count:
        type: integer
      message:
        type: string
      success:
        type: boolean
    type: object
  handlers.ChangePasswordRequest:
    properties:
      confirm_password:
        minLength: 8
        type: string
      current_password:
        type: string
      email:
        type: string
      new_password:
        minLength: 8
        type: string
    required:
    - confirm_password
    - current_password
    - email
    - new_password
    type: object
  handlers.ChangePasswordResponse:
    properties:
      changed:
        type: boolean
      email:
        type: string
    type: object
  handlers.EmployeeAirlineInfoResponse:
    properties:
      _links:
        items:
          $ref: '#/definitions/handlers.Link'
        type: array
      airline_code:
        type: string
      airline_id:
        type: string
      airline_name:
        type: string
      bp:
        type: string
      end_date:
        type: string
      start_date:
        type: string
    type: object
  handlers.EmployeeRequest:
    properties:
      email:
        type: string
      identificationNumber:
        type: string
      name:
        type: string
      password:
        type: string
      role:
        type: string
    type: object
  handlers.EmployeeResponse:
    properties:
      _links:
        items:
          $ref: '#/definitions/handlers.Link'
        type: array
      email:
        type: string
      id:
        type: string
      identification_number:
        type: string
      name:
        type: string
      role:
        type: string
    type: object
  handlers.EngineListResponse:
    properties:
      _links:
        items:
          $ref: '#/definitions/handlers.Link'
        type: array
      engines:
        items:
          $ref: '#/definitions/handlers.EngineResponse'
        type: array
      total:
        type: integer
    type: object
  handlers.EngineResponse:
    properties:
      _links:
        items:
          $ref: '#/definitions/handlers.Link'
        type: array
      id:
        type: string
      name:
        type: string
    type: object
  handlers.Link:
    properties:
      href:
        type: string
      method:
        type: string
      rel:
        type: string
    type: object
  handlers.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  handlers.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  handlers.MessageCreatedResponse:
    properties:
      _links:
        items:
          $ref: '#/definitions/handlers.Link'
        type: array
      id:
        type: string
    type: object
  handlers.MessageListResponse:
    properties:
      _links:
        items:
          $ref: '#/definitions/handlers.Link'
        type: array
      count:
        type: integer
      messages:
        items:
          $ref: '#/definitions/handlers.MessageResponse'
        type: array
    type: object
  handlers.MessageRequest:
    properties:
      active:
        type: boolean
      category:
        type: string
      code:
        type: string
      content:
        type: string
      module:
        type: string
      title:
        type: string
      type:
        $ref: '#/definitions/github_com_champion19_api-flighthours_core_interactor_services_domain.MessageType'
    type: object
  handlers.MessageResponse:
    properties:
      _links:
        items:
          $ref: '#/definitions/handlers.Link'
        type: array
      active:
        type: boolean
      category:
        type: string
      code:
        type: string
      content:
        type: string
      id:
        type: string
      module:
        type: string
      title:
        type: string
      type:
        $ref: '#/definitions/github_com_champion19_api-flighthours_core_interactor_services_domain.MessageType'
    type: object
  handlers.MessageUpdatedResponse:
    properties:
      _links:
        items:
          $ref: '#/definitions/handlers.Link'
        type: array
    type: object
  handlers.PasswordResetRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  handlers.PasswordResetResponse:
    properties:
      sent:
        type: boolean
    type: object
  handlers.ResendVerificationEmailRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  handlers.ResendVerificationEmailResponse:
    properties:
      email:
        type: string
      sent:
        type: boolean
    type: object
  handlers.RouteListResponse:
    properties:
      _links:
        items:
          $ref: '#/definitions/handlers.Link'
        type: array
      routes:
        items:
          $ref: '#/definitions/handlers.RouteResponse'
        type: array
      total:
        type: integer
    type: object
  handlers.RouteResponse:
    properties:
      _links:
        items:
          $ref: '#/definitions/handlers.Link'
        type: array
      airport_type:
        type: string
      destination_airport_id:
        type: string
      destination_airport_name:
        type: string
      destination_country:
        type: string
      destination_iata_code:
        type: string
      estimated_flight_time:
        type: string
      id:
        type: string
      origin_airport_id:
        type: string
      origin_airport_name:
        type: string
      origin_country:
        type: string
      origin_iata_code:
        type: string
      route_code:
        type: string
    type: object
  handlers.StatusChangeResponse:
    properties:
      _links:
        items:
          $ref: '#/definitions/handlers.Link'
        type: array
      active:
        type: boolean
      success:
        type: boolean
    type: object
  handlers.UpdateEmployeeAirlineRequest:
    properties:
      airline_id:
        type: string
      bp:
        type: string
      end_date:
        type: string
      start_date:
        type: string
    required:
    - airline_id
    - start_date
    type: object
  handlers.UpdateEmployeeAirlineResponse:
    properties:
      _links:
        items:
          $ref: '#/definitions/handlers.Link'
        type: array
      airline_id:
        type: string
      airline_name:
        type: string
      bp:
        type: string
      end_date:
        type: string
      start_date:
        type: string
      updated:
        type: boolean
    type: object
  handlers.UpdateEmployeeRequest:
    properties:
      identificationNumber:
        type: string
      name:
        type: string
    type: object
  handlers.UpdateEmployeeResponse:
    properties:
      _links:
        items:
          $ref: '#/definitions/handlers.Link'
        type: array
      id:
        type: string
      updated:
        type: boolean
    type: object
  handlers.UpdatePasswordRequest:
    properties:
      confirm_password:
        minLength: 8
        type: string
      new_password:
        minLength: 8
        type: string
      token:
        type: string
    required:
    - confirm_password
    - new_password
    - token
    type: object
  handlers.UpdatePasswordResponse:
    properties:
      email:
        type: string
      updated:
        type: boolean
    type: object
  handlers.VerifyEmailRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  handlers.VerifyEmailResponse:
    properties:
      email:
        type: string
      verified:
        type: boolean
    type: object
  middleware.APIResponse:
    properties:
      code:
        type: string
      data: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  middleware.ErrorResponse:
    properties:
      code:
        type: string
      message:
        type: string
      success:
        type: boolean
    type: object
host: localhost:8081
info:
  contact:
    email: support@champion19.com
    name: Champion19 Support
  description: API para gestión de horas de vuelo de pilotos y tripulantes
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Flighthours API
  version: "1.0"
paths:
  /airlines:
    get:
      description: Returns a list of all airlines with optional status filter
      parameters:
      - description: Filter by status (true for active, false for inactive)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AirlineListResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List all airlines
      tags:
      - Airlines
  /airlines/{id}:
    get:
      consumes:
      - application/json
      description: Returns airline information by ID (accepts both UUID and obfuscated
        ID)
      parameters:
      - description: Airline ID (obfuscated ID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get airline by ID
      tags:
      - Airlines
  /airlines/{id}/activate:
    patch:
      consumes:
      - application/json
      description: Sets airline status to active (accepts both UUID and obfuscated
        ID)
      parameters:
      - description: Airline ID (obfuscated ID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Activate airline
      tags:
      - Airlines
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Allows an authenticated user to change their password by providing
        the current password
      parameters:
      - description: Current and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password changed
          schema:
            $ref: '#/definitions/handlers.ChangePasswordResponse'
        "400":
          description: Passwords don't match
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "401":
          description: Current password incorrect
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change authenticated user password
      tags:
      - Authentication
  /auth/password-reset:
    post:
      consumes:
      - application/json
      description: Sends an email with instructions to reset the password. Always
        returns success for security.
      parameters:
      - description: Email for password reset
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.PasswordResetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Reset email sent
          schema:
            $ref: '#/definitions/handlers.PasswordResetResponse'
        "400":
          description: Invalid email
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      summary: Request password reset
      tags:
      - Authentication
  /auth/resend-verification:
    post:
      consumes:
      - application/json
      description: Resends the verification email to a registered user who hasn't
        verified their account
      parameters:
      - description: Email to resend verification
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ResendVerificationEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Email sent
          schema:
            $ref: '#/definitions/handlers.ResendVerificationEmailResponse'
        "400":
          description: Invalid email
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "409":
          description: Email already verified
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      summary: Resend verification email
      tags:
      - Authentication
  /auth/update-password:
    post:
      consumes:
      - application/json
      description: Allows updating the password using a token received by email. Token
        expires in 12 hours.
      parameters:
      - description: Token and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdatePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password updated
          schema:
            $ref: '#/definitions/handlers.UpdatePasswordResponse'
        "400":
          description: Passwords don't match or invalid token
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "401":
          description: Expired or invalid token
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      summary: Update password with reset token
      tags:
      - Authentication
  /auth/verify-email:
    post:
      consumes:
      - application/json
      description: Verifies the user's email using a JWT proxy token
      parameters:
      - description: Verification token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Email verified
          schema:
            $ref: '#/definitions/handlers.VerifyEmailResponse'
        "400":
          description: Invalid or expired token
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "409":
          description: Email already verified
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      summary: Verify user email
      tags:
      - Authentication
  /employees:
    delete:
      description: Permanently deletes the authenticated employee's account from the
        system (Keycloak + DB)
      produces:
      - application/json
      responses:
        "200":
          description: Account deleted
          schema:
            $ref: '#/definitions/middleware.APIResponse'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "404":
          description: Employee not found
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete authenticated user account
      tags:
      - Employees
    get:
      description: Returns the profile information of the authenticated employee
      produces:
      - application/json
      responses:
        "200":
          description: User profile
          schema:
            $ref: '#/definitions/handlers.EmployeeResponse'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get authenticated user profile
      tags:
      - Employees
    put:
      consumes:
      - application/json
      description: 'Updates the basic information of the authenticated employee. Preserves:
        email, password, airline, bp.'
      parameters:
      - description: Employee data to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateEmployeeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Employee updated
          schema:
            $ref: '#/definitions/handlers.UpdateEmployeeResponse'
        "400":
          description: Invalid data
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "404":
          description: Employee not found
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update authenticated user information
      tags:
      - Employees
  /employees/airline:
    get:
      description: Returns the airline information (airline_id, airline_name, bp)
        of the authenticated employee
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.EmployeeAirlineInfoResponse'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "404":
          description: Employee not found or no airline assigned
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get authenticated employee's airline information (HU24)
      tags:
      - AirlineEmployees
    put:
      consumes:
      - application/json
      description: Adds airline information (airline_id, bp, start_date, end_date)
        for the authenticated employee. New employees are set as active=true by default.
        The 'active' field is not accepted - use activate/deactivate endpoints for
        that.
      parameters:
      - description: Airline information to add (airline_id, bp, start_date, end_date)
        in: body
        name: airline
        required: true
        schema:
          $ref: '#/definitions/handlers.AddEmployeeAirlineRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Airline info added successfully
          schema:
            $ref: '#/definitions/handlers.AddEmployeeAirlineResponse'
        "400":
          description: Invalid request data or date format
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "422":
          description: Invalid airline_id reference
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add airline information for authenticated employee (HU26)
      tags:
      - AirlineEmployees
  /employees/airline-info:
    put:
      consumes:
      - application/json
      description: Updates the airline information (airline_id, bp, start_date, end_date)
        for the authenticated employee who already has airline info. The 'active'
        field is not editable - use activate/deactivate endpoints. Requires existing
        airline info.
      parameters:
      - description: Airline information to update (airline_id, bp, start_date, end_date)
        in: body
        name: airline
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateEmployeeAirlineRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Airline info updated successfully
          schema:
            $ref: '#/definitions/handlers.UpdateEmployeeAirlineResponse'
        "400":
          description: Invalid request data or date format
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "404":
          description: Employee has no airline info to update
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "422":
          description: Invalid airline_id reference
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Edit airline information for authenticated employee (HU25)
      tags:
      - AirlineEmployees
  /employees/airline/activate:
    patch:
      description: Activates the airline information for the authenticated employee.
        The employee must already have airline info assigned.
      produces:
      - application/json
      responses:
        "200":
          description: Airline info activated successfully
          schema:
            $ref: '#/definitions/handlers.StatusChangeResponse'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "404":
          description: Employee has no airline info to activate
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Activate airline information for authenticated employee (HU27)
      tags:
      - AirlineEmployees
  /employees/airline/deactivate:
    patch:
      description: Deactivates the airline information for the authenticated employee.
        The employee must already have airline info assigned.
      produces:
      - application/json
      responses:
        "200":
          description: Airline info deactivated successfully
          schema:
            $ref: '#/definitions/handlers.StatusChangeResponse'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "404":
          description: Employee has no airline info to deactivate
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Deactivate airline information for authenticated employee (HU28)
      tags:
      - AirlineEmployees
  /engines:
    get:
      description: Returns a list of all engine types
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.EngineListResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List all engines
      tags:
      - Engines
  /engines/{id}:
    get:
      consumes:
      - application/json
