sonar.projectKey=champion19_api-flighthours
sonar.organization=champion19

# Source configuration
sonar.sources=.
sonar.exclusions=**/*_test.go,**/vendor/**,**/testdata/**,**/docs/**,**/platform/swaggo/**

# Test configuration
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Coverage report path (generated by go test)
sonar.go.coverage.reportPaths=coverage.out

# Encoding
sonar.sourceEncoding=UTF-8
