services:
  keycloak:
    build:
      context: .
      dockerfile: Containerfile
    image: keycloak-local:latest
    container_name: keycloak-prod
    restart: unless-stopped
    entrypoint: ["/opt/keycloak/bin/kc.sh", "start-dev"]
    ports:
      - "8180:8080" # HTTP (desarrollo local)
      - "8543:8443" # HTTPS (modo producción)
      - "9100:9000" # Health & Metrics
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
